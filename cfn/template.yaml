AWSTemplateFormatVersion: "2010-09-09"
Description: >
  insurance-claims-ai-pipeline: S3 + EventBridge trigger -> Step Functions Standard
  workflow (4 Lambdas) -> Rekognition + Textract + Bedrock -> DynamoDB + S3 decisions
  + SES claimant email (APPROVE/DENY) + SNS adjuster topic (NEEDS_REVIEW).

# ---------------------------------------------------------------------------
# Parameters
# ---------------------------------------------------------------------------
Parameters:

  BedrockModelId:
    Type: String
    Default: us.anthropic.claude-haiku-4-5-20251001-v1:0
    Description: >
      Bedrock cross-region inference profile ID. Verify this ID is still current
      in the Bedrock console before deploying -- model and profile IDs change.
      To use Sonnet, see guide.md S9.

  ConfidenceThreshold:
    Type: String
    Default: "0.85"
    Description: >
      Reference value documenting the confidence threshold used in GuardrailCheck.
      The threshold is hardcoded as 0.85 directly in the DefinitionString. To change
      it, edit the NumericLessThan value in the GuardrailCheck Choice state in the
      DefinitionString and redeploy.

  AdjusterEmail:
    Type: String
    Default: ""
    Description: >
      Optional email address to subscribe to the adjuster SNS topic. Leave
      blank to skip subscription. You must confirm the subscription email
      before notifications are delivered.

  SenderEmail:
    Type: String
    Description: >
      Required. SES verified email address used as the From address for claimant
      notifications (APPROVE and DENY outcomes). Must be verified as an SES identity
      in your account before deploying. Example: claims@yourdomain.com

  ClaimantEmail:
    Type: String
    Description: >
      Required. Destination email address for claimant notifications (APPROVE and DENY).
      Must be verified in SES if your account is in sandbox mode. In production
      (SES out of sandbox), any address is accepted.


# ---------------------------------------------------------------------------
# Conditions
# ---------------------------------------------------------------------------
Conditions:
  HasAdjusterEmail: !Not [!Equals [!Ref AdjusterEmail, ""]]

# ---------------------------------------------------------------------------
# Resources
# ---------------------------------------------------------------------------
Resources:

  # -------------------------------------------------------------------------
  # S3 -- Intake bucket (claim uploads)
  # -------------------------------------------------------------------------
  IntakeBucket:
    Type: AWS::S3::Bucket
    Properties:
      # Deterministic name avoids circular dependency with IAM roles that
      # reference the bucket ARN. Roles use !Sub with the same formula.
      BucketName: !Sub "${AWS::StackName}-intake-${AWS::AccountId}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      NotificationConfiguration:
        EventBridgeConfiguration:
          EventBridgeEnabled: true

  IntakeBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref IntakeBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyNonTLS
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !GetAtt IntakeBucket.Arn
              - !Sub "${IntakeBucket.Arn}/*"
            Condition:
              Bool:
                "aws:SecureTransport": "false"

  # -------------------------------------------------------------------------
  # S3 -- Decisions bucket (pipeline outputs)
  # -------------------------------------------------------------------------
  DecisionsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${AWS::StackName}-decisions-${AWS::AccountId}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  DecisionsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref DecisionsBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyNonTLS
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !GetAtt DecisionsBucket.Arn
              - !Sub "${DecisionsBucket.Arn}/*"
            Condition:
              Bool:
                "aws:SecureTransport": "false"

  # -------------------------------------------------------------------------
  # DynamoDB -- ClaimsDecisions table
  # PK=client_id (S), SK=claim_id (S)
  # GSI: StatusIndex -- final_status (S) + processed_at (S)
  # -------------------------------------------------------------------------
  ClaimsDecisionsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Delete
    Properties:
      TableName: !Sub "${AWS::StackName}-ClaimsDecisions"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: client_id
          AttributeType: S
        - AttributeName: claim_id
          AttributeType: S
        - AttributeName: final_status
          AttributeType: S
        - AttributeName: processed_at
          AttributeType: S
      KeySchema:
        - AttributeName: client_id
          KeyType: HASH
        - AttributeName: claim_id
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: StatusIndex
          KeySchema:
            - AttributeName: final_status
              KeyType: HASH
            - AttributeName: processed_at
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  # -------------------------------------------------------------------------
  # SNS -- Adjuster notifications topic (NEEDS_REVIEW path)
  # -------------------------------------------------------------------------
  AdjusterNotificationsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub "${AWS::StackName}-AdjusterNotifications"

  AdjusterEmailSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasAdjusterEmail
    Properties:
      TopicArn: !Ref AdjusterNotificationsTopic
      Protocol: email
      Endpoint: !Ref AdjusterEmail

  # -------------------------------------------------------------------------
  # CloudWatch Log Groups
  # -------------------------------------------------------------------------
  StateMachineLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/states/${AWS::StackName}-ClaimsStateMachine"
      RetentionInDays: 14

  ReadManifestLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-ReadManifest"
      RetentionInDays: 14

  ReadTextLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-ReadText"
      RetentionInDays: 14

  SynthesizeVerdictLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-SynthesizeVerdict"
      RetentionInDays: 14

  WriteArtifactsLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-WriteArtifacts"
      RetentionInDays: 14

  # -------------------------------------------------------------------------
  # IAM -- Lambda execution roles (one per Lambda, least-privilege)
  # -------------------------------------------------------------------------
  ReadManifestRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${AWS::StackName}-ReadManifestRole"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: ReadManifestPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub "arn:aws:s3:::${AWS::StackName}-intake-${AWS::AccountId}/clients/*"

  ReadTextRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${AWS::StackName}-ReadTextRole"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: ReadTextPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub "arn:aws:s3:::${AWS::StackName}-intake-${AWS::AccountId}/clients/*"
              - Effect: Allow
                Action:
                  - comprehend:DetectSentiment
                  - comprehend:DetectKeyPhrases
                Resource: "*"

  SynthesizeVerdictRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${AWS::StackName}-SynthesizeVerdictRole"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: SynthesizeVerdictPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # Cross-region inference profile: must grant on BOTH the profile ARN
              # AND the underlying foundation-model ARNs. Foundation model ARNs have
              # no account ID (double ::) and the region wildcard is required because
              # the profile load-balances across all regions in the group -- the set
              # of target regions is controlled by AWS and can change without notice.
              - Effect: Allow
                Action: bedrock:InvokeModel
                Resource:
                  - !Sub "arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/${BedrockModelId}"
                  - "arn:aws:bedrock:*::foundation-model/anthropic.claude-haiku-4-5-20251001-v1:0"

  WriteArtifactsRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${AWS::StackName}-WriteArtifactsRole"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: WriteArtifactsPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: s3:PutObject
                Resource: !Sub "arn:aws:s3:::${AWS::StackName}-decisions-${AWS::AccountId}/clients/*"
              - Effect: Allow
                Action: dynamodb:PutItem
                Resource: !GetAtt ClaimsDecisionsTable.Arn

  # -------------------------------------------------------------------------
  # IAM -- Step Functions execution role
  # -------------------------------------------------------------------------
  StateMachineRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${AWS::StackName}-StateMachineRole"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: states.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: StateMachinePolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # Lambda invocations (4 functions only)
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource:
                  - !GetAtt ReadManifestFunction.Arn
                  - !GetAtt ReadTextFunction.Arn
                  - !GetAtt SynthesizeVerdictFunction.Arn
                  - !GetAtt WriteArtifactsFunction.Arn
              # S3 HeadObject for ValidateArtifacts Map
              - Effect: Allow
                Action: s3:HeadObject
                Resource: !Sub "arn:aws:s3:::${AWS::StackName}-intake-${AWS::AccountId}/clients/*"
              # S3 GetObject for Rekognition/Textract direct integrations
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub "arn:aws:s3:::${AWS::StackName}-intake-${AWS::AccountId}/clients/*"
              # Rekognition -- no resource-level ARN for DetectLabels
              - Effect: Allow
                Action: rekognition:DetectLabels
                Resource: "*"
              # Textract -- no resource-level permissions at all
              - Effect: Allow
                Action: textract:AnalyzeDocument
                Resource: "*"
              # SNS Publish -- adjuster topic (NEEDS_REVIEW path)
              - Effect: Allow
                Action: sns:Publish
                Resource: !Ref AdjusterNotificationsTopic
              # SES SendEmail -- claimant notifications (APPROVE and DENY paths)
              # Scoped to the verified sender identity only
              - Effect: Allow
                Action: ses:SendEmail
                Resource: !Sub "arn:aws:ses:${AWS::Region}:${AWS::AccountId}:identity/${SenderEmail}"
              # CloudWatch Logs for state machine execution logging
              - Effect: Allow
                Action:
                  - logs:CreateLogDelivery
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:DescribeLogGroups
                  - logs:DescribeLogStreams
                  - logs:DescribeResourcePolicies
                  - logs:GetLogDelivery
                  - logs:ListLogDeliveries
                  - logs:PutLogEvents
                  - logs:PutResourcePolicy
                  - logs:UpdateLogDelivery
                Resource: "*"
              # X-Ray tracing
              - Effect: Allow
                Action:
                  - xray:PutTraceSegments
                  - xray:PutTelemetryRecords
                  - xray:GetSamplingRules
                  - xray:GetSamplingTargets
                Resource: "*"

  # -------------------------------------------------------------------------
  # IAM -- EventBridge execution role
  # -------------------------------------------------------------------------
  EventBridgeRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${AWS::StackName}-EventBridgeRole"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: EventBridgePolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: states:StartExecution
                Resource: !Ref ClaimsStateMachine

  # -------------------------------------------------------------------------
  # Lambda functions (Python 3.12, ARM64)
  # All code inline via ZipFile. Handler: index.lambda_handler -> def lambda_handler().
  # -------------------------------------------------------------------------
  ReadManifestFunction:
    Type: AWS::Lambda::Function
    DependsOn: ReadManifestLogGroup
    Properties:
      FunctionName: !Sub "${AWS::StackName}-ReadManifest"
      Runtime: python3.12
      Architectures: [arm64]
      Handler: index.lambda_handler
      Role: !GetAtt ReadManifestRole.Arn
      MemorySize: 256
      Timeout: 30
      Code:
        ZipFile: |
          import json
          import os
          import boto3

          INTAKE_BUCKET = os.environ["INTAKE_BUCKET"]
          DECISIONS_BUCKET = os.environ["DECISIONS_BUCKET"]

          s3 = boto3.client("s3")

          VALID_TYPES = {"image", "document", "text"}
          IMAGE_EXTS = {".jpg", ".jpeg", ".png"}
          DOC_EXTS = {".pdf", ".png"}


          class ManifestError(Exception):
              pass


          def lambda_handler(event, context):
              bucket = event["detail"]["bucket"]["name"]
              key = event["detail"]["object"]["key"]

              response = s3.get_object(Bucket=bucket, Key=key)
              raw = response["Body"].read()
              if len(raw) > 100_000:
                  raise ManifestError("manifest.json exceeds 100 KB size limit")

              try:
                  manifest = json.loads(raw)
              except json.JSONDecodeError as e:
                  raise ManifestError(f"manifest.json is not valid JSON: {e}")

              _validate(manifest, bucket, key)

              for artifact in manifest["artifacts"]:
                  artifact["intake_bucket"] = INTAKE_BUCKET

              return {
                  "client_id": manifest["client_id"],
                  "claim_id": manifest["claim_id"],
                  "submitted_at": manifest.get("submitted_at", ""),
                  "intake_bucket": INTAKE_BUCKET,
                  "decisions_bucket": DECISIONS_BUCKET,
                  "artifacts": manifest["artifacts"],
              }


          def _validate(manifest, bucket, key):
              required = ["schema_version", "client_id", "claim_id", "artifacts"]
              for field in required:
                  if field not in manifest:
                      raise ManifestError(f"manifest.json missing required field: {field}")

              if not isinstance(manifest["artifacts"], list):
                  raise ManifestError("artifacts must be a list")

              if len(manifest["artifacts"]) == 0:
                  raise ManifestError("artifacts list is empty")

              if len(manifest["artifacts"]) > 20:
                  raise ManifestError("artifacts list exceeds maximum of 20 items")

              client_id = manifest["client_id"]
              claim_id = manifest["claim_id"]
              expected_prefix = f"clients/{client_id}/{claim_id}/"

              for i, artifact in enumerate(manifest["artifacts"]):
                  if "type" not in artifact:
                      raise ManifestError(f"artifact[{i}] missing 'type'")
                  if "key" not in artifact:
                      raise ManifestError(f"artifact[{i}] missing 'key'")

                  atype = artifact["type"]
                  akey = artifact["key"]

                  if atype not in VALID_TYPES:
                      raise ManifestError(
                          f"artifact[{i}] has invalid type '{atype}'. "
                          f"Must be one of: {sorted(VALID_TYPES)}"
                      )

                  if not akey.startswith(expected_prefix):
                      raise ManifestError(
                          f"artifact[{i}] key '{akey}' must start with '{expected_prefix}'"
                      )

                  ext = "." + akey.rsplit(".", 1)[-1].lower() if "." in akey else ""
                  if atype == "image" and ext not in IMAGE_EXTS:
                      raise ManifestError(
                          f"artifact[{i}] is type 'image' but extension is '{ext}'. "
                          f"Allowed: {sorted(IMAGE_EXTS)}"
                      )
                  if atype == "document" and ext not in DOC_EXTS:
                      raise ManifestError(
                          f"artifact[{i}] is type 'document' but extension is '{ext}'. "
                          f"Note: Textract sync requires single-page PDF or PNG. "
                          f"Allowed: {sorted(DOC_EXTS)}"
                      )
      Environment:
        Variables:
          INTAKE_BUCKET: !Sub "${AWS::StackName}-intake-${AWS::AccountId}"
          DECISIONS_BUCKET: !Sub "${AWS::StackName}-decisions-${AWS::AccountId}"

  ReadTextFunction:
    Type: AWS::Lambda::Function
    DependsOn: ReadTextLogGroup
    Properties:
      FunctionName: !Sub "${AWS::StackName}-ReadText"
      Runtime: python3.12
      Architectures: [arm64]
      Handler: index.lambda_handler
      Role: !GetAtt ReadTextRole.Arn
      MemorySize: 256
      Timeout: 30
      Code:
        ZipFile: |
          import boto3

          s3 = boto3.client("s3")
          comprehend = boto3.client("comprehend")

          MAX_TEXT_BYTES = 100_000
          MAX_COMPREHEND_BYTES = 5_000


          def lambda_handler(event, context):
              artifact = event["artifact"]
              intake_bucket = artifact["intake_bucket"]
              key = artifact["key"]

              response = s3.get_object(Bucket=intake_bucket, Key=key)
              body = response["Body"].read(MAX_TEXT_BYTES + 1)

              if len(body) > MAX_TEXT_BYTES:
                  body = body[:MAX_TEXT_BYTES]

              try:
                  content = body.decode("utf-8")
              except UnicodeDecodeError:
                  content = body.decode("utf-8", errors="replace")

              comprehend_input = content[:MAX_COMPREHEND_BYTES]

              sentiment_response = comprehend.detect_sentiment(
                  Text=comprehend_input,
                  LanguageCode="en",
              )

              phrases_response = comprehend.detect_key_phrases(
                  Text=comprehend_input,
                  LanguageCode="en",
              )

              top_phrases = [
                  p["Text"]
                  for p in sorted(phrases_response["KeyPhrases"], key=lambda x: x["Score"], reverse=True)[:10]
              ]

              return {
                  "type": "text",
                  "key": key,
                  "content": content,
                  "sentiment": sentiment_response["Sentiment"],
                  "sentiment_scores": sentiment_response["SentimentScore"],
                  "key_phrases": top_phrases,
              }

  SynthesizeVerdictFunction:
    Type: AWS::Lambda::Function
    DependsOn: SynthesizeVerdictLogGroup
    Properties:
      FunctionName: !Sub "${AWS::StackName}-SynthesizeVerdict"
      Runtime: python3.12
      Architectures: [arm64]
      Handler: index.lambda_handler
      Role: !GetAtt SynthesizeVerdictRole.Arn
      MemorySize: 512
      Timeout: 120
      Code:
        ZipFile: |
          import json
          import os
          import re
          import boto3
          from botocore.config import Config

          MODEL_ID = os.environ["BEDROCK_MODEL_ID"]
          REGION = os.environ.get("AWS_REGION", "us-east-1")

          _config = Config(
              region_name=REGION,
              read_timeout=110,
              connect_timeout=10,
              retries={"max_attempts": 1},
          )
          bedrock = boto3.client("bedrock-runtime", config=_config)

          SYSTEM_PROMPT = (
              "You are an insurance claims adjudication assistant helping human adjusters "
              "review claim evidence.\n\n"
              "IMPORTANT: You are drafting a recommendation for review by a licensed adjuster. "
              "You are NOT making a final decision. Your output will be validated and may be "
              "overridden before any action is taken.\n\n"
              "Analyze the evidence provided and output a JSON object with this exact schema:\n"
              '{"claimant_name":"<full name extracted from evidence; empty string if not found>",'
              '"recommendation":"APPROVE or DENY or NEEDS_REVIEW","confidence":<float 0.0-1.0>,'
              '"reasoning":"<2-4 sentences factual>","approval_rationale":"<one sentence if APPROVE else empty string>",'
              '"denial_reasons":["<plain-language reason; empty list if not DENY>"],'
              '"red_flags":["<concerns for any recommendation; empty list if none>"],'
              '"client_letter":"<professional letter body to claimant; 3-5 sentences; NO salutation or closing>",'
              '"adjuster_summary":"<one-paragraph internal summary for the adjuster>"}\n\n'
              "STRICT RULES for client_letter:\n"
              "- DO NOT mention: confidence scores, red flags, internal reasoning, AI, automated systems\n"
              "- DO NOT include denial reasons even for DENY -- those go in denial_reasons only\n"
              "- Professional, empathetic, plain language; 3-5 sentences\n"
              "- No salutation (Dear...) or closing (Sincerely...) -- added by the system\n"
              "- If recommendation is DENY: write 1-2 sentences acknowledging the claim cannot be approved; do NOT include the reasons (those go in denial_reasons); do NOT set to empty string\n"
              "- If recommendation is NEEDS_REVIEW: set client_letter to empty string -- a human adjuster will draft the communication\n\n"
              "adjuster_summary MAY reference confidence, red flags, denial reasons, and internal concerns.\n\n"
              "Guidelines:\n"
              "- APPROVE: evidence is consistent, no red flags, straightforward claim\n"
              "- DENY: clear evidence of fraud, excluded peril, or policy violation (rare)\n"
              "- NEEDS_REVIEW: ambiguous evidence, conflicting signals, or anything requiring judgment\n\n"
              "Output ONLY the JSON object. No preamble, no explanation outside the JSON."
          )


          def lambda_handler(event, context):
              client_id = event["client_id"]
              claim_id = event["claim_id"]
              evidence = event["evidence"]

              parts = [f"Claim ID: {claim_id}\nClient: {client_id}\n\n## Evidence\n"]

              for item in evidence.get("artifacts", []):
                  artifact = item.get("artifact", {})
                  analysis = item.get("analysis", {})
                  atype = analysis.get("type", "")
                  akey = artifact.get("key", "")

                  if atype == "image":
                      labels = ", ".join(
                          f"{l.get('Name','')} ({l.get('Confidence',0):.0f}%)"
                          for l in analysis.get("Labels", [])
                      )
                      parts.append(f"### Image Analysis (Rekognition): {akey}\nDetected: {labels}\n\n")

                  elif atype == "document":
                      blocks = analysis.get("Blocks", [])
                      lines = []
                      form_fields = []
                      value_map = {}
                      block_index = {b["Id"]: b for b in blocks}

                      def get_child_text(blk):
                          words = []
                          for rel in blk.get("Relationships", []):
                              if rel["Type"] == "CHILD":
                                  for cid in rel["Ids"]:
                                      child = block_index.get(cid, {})
                                      if child.get("BlockType") == "WORD":
                                          words.append(child.get("Text", ""))
                          return " ".join(words)

                      for block in blocks:
                          btype = block.get("BlockType", "")
                          if btype == "LINE":
                              lines.append(block.get("Text", ""))
                          elif btype == "KEY_VALUE_SET":
                              entity = block.get("EntityTypes", [])
                              if "KEY" in entity:
                                  key_text = get_child_text(block)
                                  for rel in block.get("Relationships", []):
                                      if rel["Type"] == "VALUE":
                                          for vid in rel["Ids"]:
                                              value_map[vid] = key_text
                              elif "VALUE" in entity:
                                  val_text = get_child_text(block)
                                  key_text = value_map.get(block["Id"], "")
                                  if key_text:
                                      form_fields.append({"key": key_text, "value": val_text})

                      parts.append(f"### Document Analysis (Textract): {akey}\n")
                      if form_fields:
                          fields = "; ".join(f"{f['key']}: {f['value']}" for f in form_fields[:20])
                          parts.append(f"Form fields: {fields}\n")
                      if lines:
                          parts.append(f"Extracted text:\n{chr(10).join(lines)[:2000]}\n\n")

                  elif atype == "text":
                      content = analysis.get("content", "")
                      sentiment = analysis.get("sentiment", "")
                      key_phrases = analysis.get("key_phrases", [])
                      phrases_str = ", ".join(key_phrases) if key_phrases else "none"
                      parts.append(
                          f"### Written Statement: {akey}\n"
                          f"Comprehend sentiment: {sentiment}\n"
                          f"Key phrases: {phrases_str}\n\n"
                          f"{content[:2000]}\n\n"
                      )

              parts.append("\nBased on this evidence, provide your adjudication recommendation as a JSON object.")
              user_message = "".join(parts)

              body = {
                  "anthropic_version": "bedrock-2023-05-31",
                  "max_tokens": 2048,
                  "temperature": 0,
                  "system": SYSTEM_PROMPT,
                  "messages": [{"role": "user", "content": user_message}],
              }

              response = bedrock.invoke_model(
                  modelId=MODEL_ID,
                  body=json.dumps(body),
                  contentType="application/json",
                  accept="application/json",
              )

              raw_body = json.loads(response["body"].read())
              llm_text = raw_body["content"][0]["text"].strip()

              try:
                  verdict = json.loads(llm_text)
              except json.JSONDecodeError:
                  match = re.search(r"\{.*\}", llm_text, re.DOTALL)
                  if match:
                      verdict = json.loads(match.group())
                  else:
                      raise ValueError(f"Bedrock response is not valid JSON: {llm_text[:500]}")

              required = [
                  "claimant_name", "recommendation", "confidence", "reasoning",
                  "approval_rationale", "denial_reasons", "red_flags",
                  "client_letter", "adjuster_summary",
              ]
              for field in required:
                  if field not in verdict:
                      raise ValueError(f"Bedrock verdict missing required field: {field}")

              if verdict["recommendation"] not in ("APPROVE", "DENY", "NEEDS_REVIEW"):
                  raise ValueError(f"Invalid recommendation: {verdict['recommendation']}")

              return {
                  "client_id": client_id,
                  "claim_id": claim_id,
                  "submitted_at": event.get("submitted_at", ""),
                  "decisions_bucket": event["decisions_bucket"],
                  "evidence": evidence,
                  "llm_verdict": verdict,
              }
      Environment:
        Variables:
          BEDROCK_MODEL_ID: !Ref BedrockModelId

  WriteArtifactsFunction:
    Type: AWS::Lambda::Function
    DependsOn: WriteArtifactsLogGroup
    Properties:
      FunctionName: !Sub "${AWS::StackName}-WriteArtifacts"
      Runtime: python3.12
      Architectures: [arm64]
      Handler: index.lambda_handler
      Role: !GetAtt WriteArtifactsRole.Arn
      MemorySize: 256
      Timeout: 30
      Code:
        ZipFile: |
          import json
          import os
          from datetime import datetime, timezone, timedelta
          import boto3

          s3 = boto3.client("s3")
          dynamodb = boto3.client("dynamodb")
          TABLE_NAME = os.environ["DECISIONS_TABLE_NAME"]

          _CLAIMANT_CLOSE = (
              "\n\nPlease retain your claim reference number for your records."
              " If you have questions, contact us at claims@example.com or 1-800-CLAIMS-1."
              "\n\nSincerely,\nClaims Department"
          )
          _NEEDS_REVIEW_LETTER = (
              "Thank you for submitting your insurance claim. We have received your claim"
              " and it is currently under review by one of our licensed adjusters.\n\n"
              "An adjuster will contact you within 5 business days with an update on the"
              " status of your claim. Please have your claim reference number available"
              " when we contact you.\n\n"
              "If you have any questions in the meantime, please contact us at"
              " claims@example.com or 1-800-CLAIMS-1."
          )


          def lambda_handler(event, context):
              client_id = event["client_id"]
              claim_id = event["claim_id"]
              decisions_bucket = event["decisions_bucket"]
              prefix = f"clients/{client_id}/{claim_id}"

              now = datetime.now(timezone.utc)
              created_at = now.isoformat()
              ttl = int((now + timedelta(days=90)).timestamp())

              llm_verdict = event["llm_verdict"]
              final_status = event["final_status"]
              override_reason = event.get("override_reason")

              decision = {
                  "client_id": client_id,
                  "claim_id": claim_id,
                  "submitted_at": event.get("submitted_at", ""),
                  "processed_at": created_at,
                  "final_status": final_status,
                  "original_recommendation": llm_verdict["recommendation"],
                  "confidence": llm_verdict["confidence"],
                  "override_reason": override_reason,
                  "reasoning": llm_verdict.get("reasoning", ""),
                  "approval_rationale": llm_verdict.get("approval_rationale", ""),
                  "denial_reasons": llm_verdict.get("denial_reasons", []),
                  "red_flags": llm_verdict.get("red_flags", []),
              }

              s3.put_object(
                  Bucket=decisions_bucket,
                  Key=f"{prefix}/decision.json",
                  Body=json.dumps(decision, indent=2).encode(),
                  ContentType="application/json",
              )

              name = llm_verdict.get("claimant_name", "").strip()
              salutation = f"Dear {name}," if name else "Dear Claimant,"
              if final_status == "APPROVE":
                  body = llm_verdict.get("client_letter", "")
                  client_letter = f"{salutation}\n\n{body}{_CLAIMANT_CLOSE}\n"
              elif final_status == "DENY":
                  body = llm_verdict.get("client_letter", "").strip()
                  if not body:
                      body = "We have completed our review of your insurance claim and regret that we are unable to approve your request."
                  denial_reasons = llm_verdict.get("denial_reasons", [])
                  reasons_block = ""
                  if denial_reasons:
                      bullets = "\n".join(f"  - {r}" for r in denial_reasons)
                      reasons_block = f"\n\nReason(s) for this decision:\n{bullets}"
                  appeal = (
                      "\n\nIf you disagree with this decision, you have the right to appeal"
                      " within 30 days by contacting our Claims Appeals Department at"
                      " claims-appeals@example.com or by calling 1-800-CLAIMS-2."
                  )
                  client_letter = f"{salutation}\n\n{body}{reasons_block}{appeal}{_CLAIMANT_CLOSE}\n"
              else:
                  client_letter = (
                      f"{salutation}\n\n{_NEEDS_REVIEW_LETTER}"
                      f"\n\nYour claim reference: {claim_id}{_CLAIMANT_CLOSE}\n"
                  )

              s3.put_object(
                  Bucket=decisions_bucket,
                  Key=f"{prefix}/client_letter.txt",
                  Body=client_letter.encode("ascii", errors="replace"),
                  ContentType="text/plain",
              )

              confidence = llm_verdict["confidence"]
              original_rec = llm_verdict["recommendation"]
              override_section = f"\n## Override\n{override_reason}\n" if override_reason else ""
              red_flags = llm_verdict.get("red_flags", [])
              red_flags_block = "None" if not red_flags else "\n".join(f"- {f}" for f in red_flags)
              approval_rationale = llm_verdict.get("approval_rationale", "")
              approval_section = f"\n## Approval Rationale\n{approval_rationale}\n" if approval_rationale else ""
              denial_reasons = llm_verdict.get("denial_reasons", [])
              denial_section = ""
              if denial_reasons:
                  bullets = "\n".join(f"- {r}" for r in denial_reasons)
                  denial_section = f"\n## Denial Reasons\n{bullets}\n"
              raw_json = json.dumps(llm_verdict, indent=2)

              adjuster_brief = (
                  f"# Adjuster Brief - Claim {claim_id}\n"
                  f"**Client:** {client_id}\n"
                  f"**Processed:** {created_at}\n"
                  f"**Final Status:** {final_status}\n"
                  f"\n## Summary\n{llm_verdict.get('adjuster_summary', '')}\n"
                  f"\n## Recommendation and Confidence\n"
                  f"- Original recommendation: {original_rec}\n"
                  f"- Confidence: {confidence:.0%}\n"
                  f"- Final status: {final_status}\n"
                  f"{override_section}"
                  f"\n## Reasoning\n{llm_verdict.get('reasoning', '')}\n"
                  f"\n## Red Flags\n{red_flags_block}\n"
                  f"{approval_section}"
                  f"{denial_section}"
                  f"\n## Original Bedrock Output\n```json\n{raw_json}\n```\n"
              )

              s3.put_object(
                  Bucket=decisions_bucket,
                  Key=f"{prefix}/adjuster_brief.md",
                  Body=adjuster_brief.encode(),
                  ContentType="text/markdown",
              )

              adj_red_flags = llm_verdict.get("red_flags", [])
              adj_red_flags_block = "None" if not adj_red_flags else "\n".join(f"- {f}" for f in adj_red_flags)
              adjuster_notification = (
                  f"Claim {claim_id} ({client_id}) requires adjuster review.\n\n"
                  f"Summary:\n{llm_verdict.get('adjuster_summary', '')}\n\n"
                  f"Reasoning:\n{llm_verdict.get('reasoning', '')}\n\n"
                  f"Red Flags:\n{adj_red_flags_block}\n\n"
                  f"Full brief: s3://{decisions_bucket}/{prefix}/adjuster_brief.md"
              )

              bundle = {
                  "decision": decision,
                  "llm_verdict": llm_verdict,
                  "evidence": event.get("evidence", {}),
              }
              s3.put_object(
                  Bucket=decisions_bucket,
                  Key=f"{prefix}/evidence_bundle.json",
                  Body=json.dumps(bundle, indent=2).encode(),
                  ContentType="application/json",
              )

              dynamodb.put_item(
                  TableName=TABLE_NAME,
                  Item={
                      "client_id":              {"S": client_id},
                      "claim_id":               {"S": claim_id},
                      "submitted_at":           {"S": event.get("submitted_at", "")},
                      "processed_at":           {"S": created_at},
                      "final_status":           {"S": final_status},
                      "original_recommendation": {"S": original_rec},
                      "confidence":             {"N": str(confidence)},
                      "override_reason":        {"S": override_reason or ""},
                      "reasoning":              {"S": llm_verdict.get("reasoning", "")[:1000]},
                      "approval_rationale":     {"S": approval_rationale},
                      "denial_reasons":         {"S": json.dumps(denial_reasons)},
                      "red_flags":              {"S": json.dumps(red_flags)},
                      "decision_s3_prefix":     {"S": f"s3://{decisions_bucket}/{prefix}/"},
                      "ttl":                    {"N": str(ttl)},
                  },
              )

              return {
                  "client_id": client_id,
                  "claim_id": claim_id,
                  "final_status": final_status,
                  "decision_s3_prefix": f"s3://{decisions_bucket}/{prefix}/",
                  "client_letter": client_letter,
                  "adjuster_brief": adjuster_notification,
              }
      Environment:
        Variables:
          DECISIONS_TABLE_NAME: !Sub "${AWS::StackName}-ClaimsDecisions"

  # -------------------------------------------------------------------------
  # Step Functions -- State machine (ASL inlined via Fn::Sub)
  # -------------------------------------------------------------------------
  ClaimsStateMachine:
    Type: AWS::StepFunctions::StateMachine
    Properties:
      StateMachineName: !Sub "${AWS::StackName}-ClaimsStateMachine"
      StateMachineType: STANDARD
      RoleArn: !GetAtt StateMachineRole.Arn
      LoggingConfiguration:
        Level: ERROR
        IncludeExecutionData: true
        Destinations:
          - CloudWatchLogsLogGroup:
              LogGroupArn: !GetAtt StateMachineLogGroup.Arn
      DefinitionSubstitutions:
        ReadManifestFunctionArn: !GetAtt ReadManifestFunction.Arn
        ReadTextFunctionArn: !GetAtt ReadTextFunction.Arn
        SynthesizeVerdictFunctionArn: !GetAtt SynthesizeVerdictFunction.Arn
        WriteArtifactsFunctionArn: !GetAtt WriteArtifactsFunction.Arn
        AdjusterNotificationsTopicArn: !Ref AdjusterNotificationsTopic
        SenderEmail: !Ref SenderEmail
        ClaimantEmail: !Ref ClaimantEmail
      DefinitionString: |
        {
          "Comment": "insurance-claims-ai-pipeline: 4-Lambda design. ReadManifest -> ValidateArtifacts (Map/HeadObject) -> ProcessArtifacts (Map) -> BuildEvidence (Pass) -> SynthesizeVerdict -> GuardrailCheck -> WriteArtifacts -> RouteDecision (SES claimant email + SNS adjuster topic).",
          "StartAt": "ReadManifest",
          "States": {
            "ReadManifest": {
              "Type": "Task",
              "Resource": "arn:aws:states:::lambda:invoke",
              "Parameters": {
                "FunctionName": "${ReadManifestFunctionArn}",
                "Payload.$": "$"
              },
              "ResultSelector": { "body.$": "$.Payload" },
              "ResultPath": "$",
              "OutputPath": "$.body",
              "Retry": [
                {
                  "ErrorEquals": ["Lambda.ServiceException","Lambda.AWSLambdaException","Lambda.SdkClientException"],
                  "IntervalSeconds": 2, "MaxAttempts": 3, "BackoffRate": 2.0
                }
              ],
              "Catch": [{ "ErrorEquals": ["States.ALL"], "ResultPath": "$.error", "Next": "RecordFailure" }],
              "Next": "ValidateArtifacts"
            },
            "ValidateArtifacts": {
              "Type": "Map",
              "ItemsPath": "$.artifacts",
              "ItemSelector": { "artifact.$": "$$.Map.Item.Value" },
              "MaxConcurrency": 10,
              "ResultPath": null,
              "ItemProcessor": {
                "ProcessorConfig": { "Mode": "INLINE" },
                "StartAt": "HeadObject",
                "States": {
                  "HeadObject": {
                    "Type": "Task",
                    "Resource": "arn:aws:states:::aws-sdk:s3:headObject",
                    "Parameters": {
                      "Bucket.$": "$.artifact.intake_bucket",
                      "Key.$": "$.artifact.key"
                    },
                    "ResultPath": null,
                    "End": true
                  }
                }
              },
              "Catch": [{ "ErrorEquals": ["States.ALL"], "ResultPath": "$.error", "Next": "RecordFailure" }],
              "Next": "ProcessArtifacts"
            },
            "ProcessArtifacts": {
              "Type": "Map",
              "ItemsPath": "$.artifacts",
              "ItemSelector": { "artifact.$": "$$.Map.Item.Value" },
              "MaxConcurrency": 10,
              "ResultPath": "$.artifact_results",
              "ItemProcessor": {
                "ProcessorConfig": { "Mode": "INLINE" },
                "StartAt": "ClassifyArtifact",
                "States": {
                  "ClassifyArtifact": {
                    "Type": "Choice",
                    "Choices": [
                      { "Variable": "$.artifact.type", "StringEquals": "image", "Next": "DetectLabels" },
                      { "Variable": "$.artifact.type", "StringEquals": "document", "Next": "AnalyzeDocument" },
                      { "Variable": "$.artifact.type", "StringEquals": "text", "Next": "ReadText" }
                    ],
                    "Default": "UnknownArtifactType"
                  },
                  "DetectLabels": {
                    "Type": "Task",
                    "Resource": "arn:aws:states:::aws-sdk:rekognition:detectLabels",
                    "Parameters": {
                      "Image": {
                        "S3Object": {
                          "Bucket.$": "$.artifact.intake_bucket",
                          "Name.$": "$.artifact.key"
                        }
                      },
                      "MaxLabels": 30,
                      "MinConfidence": 50
                    },
                    "ResultSelector": { "type": "image", "Labels.$": "$.Labels" },
                    "ResultPath": "$.analysis",
                    "Retry": [
                      {
                        "ErrorEquals": ["Rekognition.ProvisionedThroughputExceededException"],
                        "IntervalSeconds": 2, "MaxAttempts": 3, "BackoffRate": 2.0
                      }
                    ],
                    "End": true
                  },
                  "AnalyzeDocument": {
                    "Type": "Task",
                    "Resource": "arn:aws:states:::aws-sdk:textract:analyzeDocument",
                    "Parameters": {
                      "Document": {
                        "S3Object": {
                          "Bucket.$": "$.artifact.intake_bucket",
                          "Name.$": "$.artifact.key"
                        }
                      },
                      "FeatureTypes": ["FORMS", "TABLES"]
                    },
                    "ResultSelector": { "type": "document", "Blocks.$": "$.Blocks" },
                    "ResultPath": "$.analysis",
                    "Retry": [
                      {
                        "ErrorEquals": ["Textract.ProvisionedThroughputExceededException"],
                        "IntervalSeconds": 5, "MaxAttempts": 3, "BackoffRate": 2.0
                      }
                    ],
                    "End": true
                  },
                  "ReadText": {
                    "Type": "Task",
                    "Resource": "arn:aws:states:::lambda:invoke",
                    "Parameters": {
                      "FunctionName": "${ReadTextFunctionArn}",
                      "Payload.$": "$"
                    },
                    "ResultSelector": {
                      "type.$": "$.Payload.type",
                      "key.$": "$.Payload.key",
                      "content.$": "$.Payload.content",
                      "sentiment.$": "$.Payload.sentiment",
                      "sentiment_scores.$": "$.Payload.sentiment_scores",
                      "key_phrases.$": "$.Payload.key_phrases"
                    },
                    "ResultPath": "$.analysis",
                    "Retry": [
                      {
                        "ErrorEquals": ["Lambda.ServiceException","Lambda.AWSLambdaException"],
                        "IntervalSeconds": 2, "MaxAttempts": 3, "BackoffRate": 2.0
                      }
                    ],
                    "End": true
                  },
                  "UnknownArtifactType": {
                    "Type": "Fail",
                    "Error": "UnknownArtifactType",
                    "Cause": "Artifact type is not image, document, or text. Check manifest validation in ReadManifest Lambda."
                  }
                }
              },
              "Catch": [{ "ErrorEquals": ["States.ALL"], "ResultPath": "$.error", "Next": "RecordFailure" }],
              "Next": "BuildEvidence"
            },
            "BuildEvidence": {
              "Type": "Pass",
              "Parameters": {
                "client_id.$": "$.client_id",
                "claim_id.$": "$.claim_id",
                "submitted_at.$": "$.submitted_at",
                "decisions_bucket.$": "$.decisions_bucket",
                "evidence": {
                  "artifacts.$": "$.artifact_results"
                }
              },
              "Next": "SynthesizeVerdict"
            },
            "SynthesizeVerdict": {
              "Type": "Task",
              "Resource": "arn:aws:states:::lambda:invoke",
              "Parameters": {
                "FunctionName": "${SynthesizeVerdictFunctionArn}",
                "Payload.$": "$"
              },
              "ResultSelector": { "body.$": "$.Payload" },
              "ResultPath": "$",
              "OutputPath": "$.body",
              "Retry": [
                {
                  "ErrorEquals": ["Lambda.ServiceException","Lambda.AWSLambdaException","Lambda.SdkClientException","States.TaskFailed"],
                  "IntervalSeconds": 2, "MaxAttempts": 3, "BackoffRate": 2.0
                }
              ],
              "Catch": [{ "ErrorEquals": ["States.ALL"], "ResultPath": "$.error", "Next": "RecordFailure" }],
              "Next": "GuardrailCheck"
            },
            "GuardrailCheck": {
              "Type": "Choice",
              "Choices": [
                {
                  "Variable": "$.llm_verdict.confidence",
                  "NumericLessThan": 0.85,
                  "Next": "ForceNeedsReview"
                }
              ],
              "Default": "PassThroughVerdict"
            },
            "ForceNeedsReview": {
              "Type": "Pass",
              "Parameters": {
                "client_id.$": "$.client_id",
                "claim_id.$": "$.claim_id",
                "submitted_at.$": "$.submitted_at",
                "decisions_bucket.$": "$.decisions_bucket",
                "evidence.$": "$.evidence",
                "llm_verdict.$": "$.llm_verdict",
                "final_status": "NEEDS_REVIEW",
                "override_reason.$": "States.Format('Guardrail downgrade: original={}, confidence={}', $.llm_verdict.recommendation, $.llm_verdict.confidence)"
              },
              "Next": "WriteArtifacts"
            },
            "PassThroughVerdict": {
              "Type": "Pass",
              "Parameters": {
                "client_id.$": "$.client_id",
                "claim_id.$": "$.claim_id",
                "submitted_at.$": "$.submitted_at",
                "decisions_bucket.$": "$.decisions_bucket",
                "evidence.$": "$.evidence",
                "llm_verdict.$": "$.llm_verdict",
                "final_status.$": "$.llm_verdict.recommendation"
              },
              "Next": "WriteArtifacts"
            },
            "WriteArtifacts": {
              "Type": "Task",
              "Resource": "arn:aws:states:::lambda:invoke",
              "Parameters": {
                "FunctionName": "${WriteArtifactsFunctionArn}",
                "Payload.$": "$"
              },
              "ResultSelector": { "body.$": "$.Payload" },
              "ResultPath": "$",
              "OutputPath": "$.body",
              "Retry": [
                {
                  "ErrorEquals": ["Lambda.ServiceException","Lambda.AWSLambdaException"],
                  "IntervalSeconds": 2, "MaxAttempts": 2, "BackoffRate": 2.0
                }
              ],
              "Catch": [{ "ErrorEquals": ["States.ALL"], "ResultPath": "$.error", "Next": "RecordFailure" }],
              "Next": "RouteDecision"
            },
            "RouteDecision": {
              "Type": "Choice",
              "Choices": [
                { "Variable": "$.final_status", "StringEquals": "APPROVE", "Next": "NotifyClaimantApproved" },
                { "Variable": "$.final_status", "StringEquals": "DENY", "Next": "NotifyClaimantDenied" }
              ],
              "Default": "NotifyAdjuster"
            },
            "NotifyClaimantApproved": {
              "Type": "Task",
              "Resource": "arn:aws:states:::aws-sdk:sesv2:sendEmail",
              "Parameters": {
                "FromEmailAddress": "${SenderEmail}",
                "Destination": { "ToAddresses": ["${ClaimantEmail}"] },
                "Content": {
                  "Simple": {
                    "Subject": { "Data.$": "States.Format('Update on your claim {} - Approved', $.claim_id)", "Charset": "UTF-8" },
                    "Body": { "Text": { "Data.$": "$.client_letter", "Charset": "UTF-8" } }
                  }
                }
              },
              "ResultPath": null,
              "Next": "ClaimApproved"
            },
            "NotifyClaimantDenied": {
              "Type": "Task",
              "Resource": "arn:aws:states:::aws-sdk:sesv2:sendEmail",
              "Parameters": {
                "FromEmailAddress": "${SenderEmail}",
                "Destination": { "ToAddresses": ["${ClaimantEmail}"] },
                "Content": {
                  "Simple": {
                    "Subject": { "Data.$": "States.Format('Update on your claim {} - Decision', $.claim_id)", "Charset": "UTF-8" },
                    "Body": { "Text": { "Data.$": "$.client_letter", "Charset": "UTF-8" } }
                  }
                }
              },
              "ResultPath": null,
              "Next": "ClaimDenied"
            },
            "NotifyAdjuster": {
              "Type": "Task",
              "Resource": "arn:aws:states:::aws-sdk:sns:publish",
              "Parameters": {
                "TopicArn": "${AdjusterNotificationsTopicArn}",
                "Subject.$": "States.Format('Claim {} requires adjuster review', $.claim_id)",
                "Message.$": "$.adjuster_brief"
              },
              "ResultPath": null,
              "Next": "ClaimNeedsReview"
            },
            "ClaimApproved": {
              "Type": "Succeed"
            },
            "ClaimDenied": {
              "Type": "Succeed"
            },
            "ClaimNeedsReview": {
              "Type": "Succeed"
            },
            "RecordFailure": {
              "Type": "Fail",
              "Error": "ClaimProcessingFailed",
              "Cause": "An error occurred during claim processing. See SFN execution history and CloudWatch Logs for details."
            }
          }
        }

  # -------------------------------------------------------------------------
  # EventBridge -- fires on manifest.json object created in intake bucket
  # -------------------------------------------------------------------------
  IntakeManifestRule:
    Type: AWS::Events::Rule
    DependsOn: ClaimsStateMachine
    Properties:
      Name: !Sub "${AWS::StackName}-IntakeManifestRule"
      Description: Triggers Claims state machine when manifest.json is uploaded to intake bucket
      EventPattern:
        source:
          - aws.s3
        detail-type:
          - Object Created
        detail:
          bucket:
            name:
              - !Sub "${AWS::StackName}-intake-${AWS::AccountId}"
          object:
            key:
              - suffix: manifest.json
      State: ENABLED
      Targets:
        - Id: ClaimsStateMachineTarget
          Arn: !Ref ClaimsStateMachine
          RoleArn: !GetAtt EventBridgeRole.Arn

# ---------------------------------------------------------------------------
# Outputs
# ---------------------------------------------------------------------------
Outputs:

  IntakeBucketName:
    Description: S3 bucket for claim artifact uploads
    Value: !Ref IntakeBucket
    Export:
      Name: !Sub "${AWS::StackName}-IntakeBucketName"

  DecisionsBucketName:
    Description: S3 bucket for pipeline decision outputs
    Value: !Ref DecisionsBucket
    Export:
      Name: !Sub "${AWS::StackName}-DecisionsBucketName"

  StateMachineArn:
    Description: Step Functions state machine ARN
    Value: !Ref ClaimsStateMachine
    Export:
      Name: !Sub "${AWS::StackName}-StateMachineArn"

  TableName:
    Description: DynamoDB ClaimsDecisions table name
    Value: !Ref ClaimsDecisionsTable
    Export:
      Name: !Sub "${AWS::StackName}-TableName"

  AdjusterTopicArn:
    Description: SNS adjuster notifications topic ARN (NEEDS_REVIEW path)
    Value: !Ref AdjusterNotificationsTopic
    Export:
      Name: !Sub "${AWS::StackName}-AdjusterTopicArn"

  SenderEmailAddress:
    Description: SES verified sender address used for claimant notifications (APPROVE and DENY paths)
    Value: !Ref SenderEmail
    Export:
      Name: !Sub "${AWS::StackName}-SenderEmailAddress"


