AWSTemplateFormatVersion: "2010-09-09"
Description: >
  insurance-claims-ai-pipeline: S3 + EventBridge trigger -> Step Functions Standard
  workflow -> Rekognition + Textract + Bedrock -> DynamoDB + S3 decisions + SNS.

# ---------------------------------------------------------------------------
# Parameters
# ---------------------------------------------------------------------------
Parameters:

  BedrockModelId:
    Type: String
    Default: us.anthropic.claude-haiku-4-5-20251001-v1:0
    Description: >
      Bedrock cross-region inference profile ID. Verify this ID is still current
      in the Bedrock console before deploying -- model and profile IDs change.
      To use Sonnet, see guide.md S9.

  ConfidenceThreshold:
    Type: String
    Default: "0.85"
    Description: >
      LLM confidence score below which the recommendation is downgraded to
      NEEDS_REVIEW. Float as string (0.0 to 1.0).

  AdjusterEmail:
    Type: String
    Default: ""
    Description: >
      Optional email address to subscribe to the adjuster SNS topic. Leave
      blank to skip subscription. You must confirm the subscription email
      before notifications are delivered.


# ---------------------------------------------------------------------------
# Conditions
# ---------------------------------------------------------------------------
Conditions:
  HasAdjusterEmail: !Not [!Equals [!Ref AdjusterEmail, ""]]

# ---------------------------------------------------------------------------
# Resources
# ---------------------------------------------------------------------------
Resources:

  # -------------------------------------------------------------------------
  # KMS key -- SSE-KMS for S3 buckets, DynamoDB, and CloudWatch Log Groups
  # -------------------------------------------------------------------------
  KmsKey:
    Type: AWS::KMS::Key
    Properties:
      Description: insurance-claims-ai-pipeline SSE key
      EnableKeyRotation: true
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
          - Sid: RootAdmin
            Effect: Allow
            Principal:
              AWS: !Sub "arn:aws:iam::${AWS::AccountId}:root"
            Action: "kms:*"
            Resource: "*"
          - Sid: CloudWatchLogs
            Effect: Allow
            Principal:
              Service: !Sub "logs.${AWS::Region}.amazonaws.com"
            Action:
              - kms:Encrypt
              - kms:Decrypt
              - kms:ReEncrypt*
              - kms:GenerateDataKey*
              - kms:DescribeKey
            Resource: "*"
            Condition:
              ArnLike:
                kms:EncryptionContext:aws:logs:arn: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:*"

  KmsAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: !Sub "alias/${AWS::StackName}-key"
      TargetKeyId: !Ref KmsKey

  # -------------------------------------------------------------------------
  # S3 -- Intake bucket (claim uploads)
  # -------------------------------------------------------------------------
  IntakeBucket:
    Type: AWS::S3::Bucket
    Properties:
      # Deterministic name avoids circular dependency with IAM roles that
      # reference the bucket ARN. Roles use !Sub with the same formula.
      BucketName: !Sub "${AWS::StackName}-intake-${AWS::AccountId}"
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: aws:kms
              KMSMasterKeyID: !Ref KmsKey
            BucketKeyEnabled: true
      NotificationConfiguration:
        EventBridgeConfiguration:
          EventBridgeEnabled: true

  IntakeBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref IntakeBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyNonTLS
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !GetAtt IntakeBucket.Arn
              - !Sub "${IntakeBucket.Arn}/*"
            Condition:
              Bool:
                "aws:SecureTransport": "false"

  # -------------------------------------------------------------------------
  # S3 -- Decisions bucket (pipeline outputs)
  # -------------------------------------------------------------------------
  DecisionsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${AWS::StackName}-decisions-${AWS::AccountId}"
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: aws:kms
              KMSMasterKeyID: !Ref KmsKey
            BucketKeyEnabled: true

  DecisionsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref DecisionsBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyNonTLS
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !GetAtt DecisionsBucket.Arn
              - !Sub "${DecisionsBucket.Arn}/*"
            Condition:
              Bool:
                "aws:SecureTransport": "false"

  # -------------------------------------------------------------------------
  # DynamoDB -- ClaimsDecisions table
  # PK=client_id (S), SK=claim_id (S)
  # GSI: StatusIndex -- status (S) + processed_at (S)
  # Note: status has low cardinality (APPROVE/DENY/NEEDS_REVIEW/FAILED).
  # GSI hot-partition risk in real high-volume workloads; fine for this lab.
  # -------------------------------------------------------------------------
  ClaimsDecisionsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Delete
    Properties:
      TableName: !Sub "${AWS::StackName}-ClaimsDecisions"
      BillingMode: PAY_PER_REQUEST
      SSESpecification:
        SSEEnabled: true
        SSEType: KMS
        KMSMasterKeyId: !Ref KmsKey
      AttributeDefinitions:
        - AttributeName: client_id
          AttributeType: S
        - AttributeName: claim_id
          AttributeType: S
        - AttributeName: final_status
          AttributeType: S
        - AttributeName: processed_at
          AttributeType: S
      KeySchema:
        - AttributeName: client_id
          KeyType: HASH
        - AttributeName: claim_id
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: StatusIndex
          KeySchema:
            - AttributeName: final_status
              KeyType: HASH
            - AttributeName: processed_at
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  # -------------------------------------------------------------------------
  # SNS -- Adjuster notifications topic
  # -------------------------------------------------------------------------
  AdjusterNotificationsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub "${AWS::StackName}-AdjusterNotifications"
      KmsMasterKeyId: !Ref KmsKey

  AdjusterEmailSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasAdjusterEmail
    Properties:
      TopicArn: !Ref AdjusterNotificationsTopic
      Protocol: email
      Endpoint: !Ref AdjusterEmail

  # -------------------------------------------------------------------------
  # CloudWatch Log Groups
  # -------------------------------------------------------------------------
  StateMachineLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/states/${AWS::StackName}-ClaimsStateMachine"
      RetentionInDays: 14
      KmsKeyId: !GetAtt KmsKey.Arn

  ReadManifestLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-ReadManifest"
      RetentionInDays: 14
      KmsKeyId: !GetAtt KmsKey.Arn

  ValidateArtifactsLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-ValidateArtifacts"
      RetentionInDays: 14
      KmsKeyId: !GetAtt KmsKey.Arn

  ReadTextLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-ReadText"
      RetentionInDays: 14
      KmsKeyId: !GetAtt KmsKey.Arn

  NormalizeEvidenceLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-NormalizeEvidence"
      RetentionInDays: 14
      KmsKeyId: !GetAtt KmsKey.Arn

  SynthesizeVerdictLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-SynthesizeVerdict"
      RetentionInDays: 14
      KmsKeyId: !GetAtt KmsKey.Arn

  ApplyGuardrailsLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-ApplyGuardrails"
      RetentionInDays: 14
      KmsKeyId: !GetAtt KmsKey.Arn

  WriteArtifactsLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-WriteArtifacts"
      RetentionInDays: 14
      KmsKeyId: !GetAtt KmsKey.Arn

  # -------------------------------------------------------------------------
  # IAM -- Lambda execution roles (one per Lambda, least-privilege)
  # -------------------------------------------------------------------------
  ReadManifestRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${AWS::StackName}-ReadManifestRole"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: ReadManifestPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub "arn:aws:s3:::${AWS::StackName}-intake-${AWS::AccountId}/clients/*"
              - Effect: Allow
                Action:
                  - kms:Decrypt
                  - kms:GenerateDataKey
                Resource: !GetAtt KmsKey.Arn

  ValidateArtifactsRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${AWS::StackName}-ValidateArtifactsRole"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: ValidateArtifactsPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub "arn:aws:s3:::${AWS::StackName}-intake-${AWS::AccountId}/clients/*"
              - Effect: Allow
                Action:
                  - kms:Decrypt
                  - kms:GenerateDataKey
                Resource: !GetAtt KmsKey.Arn

  ReadTextRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${AWS::StackName}-ReadTextRole"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: ReadTextPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub "arn:aws:s3:::${AWS::StackName}-intake-${AWS::AccountId}/clients/*"
              - Effect: Allow
                Action:
                  - kms:Decrypt
                  - kms:GenerateDataKey
                Resource: !GetAtt KmsKey.Arn

  NormalizeEvidenceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${AWS::StackName}-NormalizeEvidenceRole"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

  SynthesizeVerdictRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${AWS::StackName}-SynthesizeVerdictRole"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: SynthesizeVerdictPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # Cross-region inference profile: must grant on BOTH the profile ARN
              # AND the underlying foundation-model ARNs in every region the profile
              # spans. Missing any region throws AccessDeniedException at runtime.
              - Effect: Allow
                Action: bedrock:InvokeModel
                Resource:
                  - !Sub "arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/${BedrockModelId}"
                  - !Sub "arn:aws:bedrock:us-east-1::foundation-model/anthropic.claude-haiku-4-5-20251001-v1:0"
                  - !Sub "arn:aws:bedrock:us-east-2::foundation-model/anthropic.claude-haiku-4-5-20251001-v1:0"
                  - !Sub "arn:aws:bedrock:us-west-2::foundation-model/anthropic.claude-haiku-4-5-20251001-v1:0"

  ApplyGuardrailsRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${AWS::StackName}-ApplyGuardrailsRole"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

  WriteArtifactsRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${AWS::StackName}-WriteArtifactsRole"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: WriteArtifactsPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: s3:PutObject
                Resource: !Sub "arn:aws:s3:::${AWS::StackName}-decisions-${AWS::AccountId}/clients/*"
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                Resource: !GetAtt ClaimsDecisionsTable.Arn
              - Effect: Allow
                Action:
                  - kms:Decrypt
                  - kms:GenerateDataKey
                Resource: !GetAtt KmsKey.Arn

  # -------------------------------------------------------------------------
  # IAM -- Step Functions execution role
  # -------------------------------------------------------------------------
  StateMachineRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${AWS::StackName}-StateMachineRole"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: states.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: StateMachinePolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # Lambda invocations
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource:
                  - !GetAtt ReadManifestFunction.Arn
                  - !GetAtt ValidateArtifactsFunction.Arn
                  - !GetAtt ReadTextFunction.Arn
                  - !GetAtt NormalizeEvidenceFunction.Arn
                  - !GetAtt SynthesizeVerdictFunction.Arn
                  - !GetAtt ApplyGuardrailsFunction.Arn
                  - !GetAtt WriteArtifactsFunction.Arn
              # Rekognition -- no resource-level ARN for DetectLabels; action is the constraint
              - Effect: Allow
                Action: rekognition:DetectLabels
                Resource: "*"
              # Textract -- no resource-level permissions at all; Resource: * is required
              - Effect: Allow
                Action: textract:AnalyzeDocument
                Resource: "*"
              # DynamoDB PutItem for RecordFailure tombstone
              - Effect: Allow
                Action: dynamodb:PutItem
                Resource: !GetAtt ClaimsDecisionsTable.Arn
              # SNS Publish for NotifyAdjuster
              - Effect: Allow
                Action: sns:Publish
                Resource: !Ref AdjusterNotificationsTopic
              # S3 GetObject for Rekognition/Textract direct integrations (read from intake)
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub "arn:aws:s3:::${AWS::StackName}-intake-${AWS::AccountId}/clients/*"
              # KMS for SSE-KMS bucket access
              - Effect: Allow
                Action:
                  - kms:Decrypt
                  - kms:GenerateDataKey
                Resource: !GetAtt KmsKey.Arn
              # CloudWatch Logs for state machine execution logging
              - Effect: Allow
                Action:
                  - logs:CreateLogDelivery
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:DescribeLogGroups
                  - logs:DescribeLogStreams
                  - logs:DescribeResourcePolicies
                  - logs:GetLogDelivery
                  - logs:ListLogDeliveries
                  - logs:PutLogEvents
                  - logs:PutResourcePolicy
                  - logs:UpdateLogDelivery
                Resource: "*"
              # X-Ray tracing (optional -- remove if X-Ray is not enabled)
              - Effect: Allow
                Action:
                  - xray:PutTraceSegments
                  - xray:PutTelemetryRecords
                  - xray:GetSamplingRules
                  - xray:GetSamplingTargets
                Resource: "*"

  # -------------------------------------------------------------------------
  # IAM -- EventBridge execution role
  # -------------------------------------------------------------------------
  EventBridgeRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${AWS::StackName}-EventBridgeRole"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: EventBridgePolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: states:StartExecution
                Resource: !Ref ClaimsStateMachine

  # -------------------------------------------------------------------------
  # Lambda functions (Python 3.12, ARM64)
  # -------------------------------------------------------------------------
  ReadManifestFunction:
    Type: AWS::Lambda::Function
    DependsOn: ReadManifestLogGroup
    Properties:
      FunctionName: !Sub "${AWS::StackName}-ReadManifest"
      Runtime: python3.12
      Architectures: [arm64]
      Handler: index.handler
      Role: !GetAtt ReadManifestRole.Arn
      MemorySize: 256
      Timeout: 30
      Code:
        ZipFile: |
          import json
          import os
          import boto3

          INTAKE_BUCKET = os.environ["INTAKE_BUCKET"]
          DECISIONS_BUCKET = os.environ["DECISIONS_BUCKET"]

          s3 = boto3.client("s3")

          VALID_TYPES = {"image", "document", "text"}
          IMAGE_EXTS = {".jpg", ".jpeg", ".png"}
          DOC_EXTS = {".pdf", ".png"}


          class ManifestError(Exception):
              pass


          def handler(event, context):
              bucket = event["detail"]["bucket"]["name"]
              key = event["detail"]["object"]["key"]

              response = s3.get_object(Bucket=bucket, Key=key)
              raw = response["Body"].read()
              if len(raw) > 100_000:
                  raise ManifestError("manifest.json exceeds 100 KB size limit")

              try:
                  manifest = json.loads(raw)
              except json.JSONDecodeError as e:
                  raise ManifestError(f"manifest.json is not valid JSON: {e}")

              _validate(manifest, bucket, key)

              for artifact in manifest["artifacts"]:
                  artifact["intake_bucket"] = INTAKE_BUCKET

              return {
                  "client_id": manifest["client_id"],
                  "claim_id": manifest["claim_id"],
                  "submitted_at": manifest.get("submitted_at", ""),
                  "intake_bucket": INTAKE_BUCKET,
                  "decisions_bucket": DECISIONS_BUCKET,
                  "artifacts": manifest["artifacts"],
              }


          def _validate(manifest, bucket, key):
              required = ["schema_version", "client_id", "claim_id", "artifacts"]
              for field in required:
                  if field not in manifest:
                      raise ManifestError(f"manifest.json missing required field: {field}")

              if not isinstance(manifest["artifacts"], list):
                  raise ManifestError("artifacts must be a list")

              if len(manifest["artifacts"]) == 0:
                  raise ManifestError("artifacts list is empty")

              if len(manifest["artifacts"]) > 20:
                  raise ManifestError("artifacts list exceeds maximum of 20 items")

              client_id = manifest["client_id"]
              claim_id = manifest["claim_id"]
              expected_prefix = f"clients/{client_id}/{claim_id}/"

              for i, artifact in enumerate(manifest["artifacts"]):
                  if "type" not in artifact:
                      raise ManifestError(f"artifact[{i}] missing 'type'")
                  if "key" not in artifact:
                      raise ManifestError(f"artifact[{i}] missing 'key'")

                  atype = artifact["type"]
                  akey = artifact["key"]

                  if atype not in VALID_TYPES:
                      raise ManifestError(
                          f"artifact[{i}] has invalid type '{atype}'. "
                          f"Must be one of: {sorted(VALID_TYPES)}"
                      )

                  if not akey.startswith(expected_prefix):
                      raise ManifestError(
                          f"artifact[{i}] key '{akey}' must start with '{expected_prefix}'"
                      )

                  ext = "." + akey.rsplit(".", 1)[-1].lower() if "." in akey else ""
                  if atype == "image" and ext not in IMAGE_EXTS:
                      raise ManifestError(
                          f"artifact[{i}] is type 'image' but extension is '{ext}'. "
                          f"Allowed: {sorted(IMAGE_EXTS)}"
                      )
                  if atype == "document" and ext not in DOC_EXTS:
                      raise ManifestError(
                          f"artifact[{i}] is type 'document' but extension is '{ext}'. "
                          f"Note: Textract sync requires single-page PDF or PNG. "
                          f"Allowed: {sorted(DOC_EXTS)}"
                      )
      Environment:
        Variables:
          INTAKE_BUCKET: !Sub "${AWS::StackName}-intake-${AWS::AccountId}"
          DECISIONS_BUCKET: !Sub "${AWS::StackName}-decisions-${AWS::AccountId}"

  ValidateArtifactsFunction:
    Type: AWS::Lambda::Function
    DependsOn: ValidateArtifactsLogGroup
    Properties:
      FunctionName: !Sub "${AWS::StackName}-ValidateArtifacts"
      Runtime: python3.12
      Architectures: [arm64]
      Handler: index.handler
      Role: !GetAtt ValidateArtifactsRole.Arn
      MemorySize: 256
      Timeout: 30
      Code:
        ZipFile: |
          import boto3
          from botocore.exceptions import ClientError

          s3 = boto3.client("s3")


          class MissingArtifactError(Exception):
              pass


          def handler(event, context):
              intake_bucket = event["intake_bucket"]
              artifacts = event["artifacts"]
              missing = []

              for artifact in artifacts:
                  key = artifact["key"]
                  try:
                      s3.head_object(Bucket=intake_bucket, Key=key)
                  except ClientError as e:
                      code = e.response["Error"]["Code"]
                      if code in ("404", "NoSuchKey"):
                          missing.append(key)
                      else:
                          raise

              if missing:
                  raise MissingArtifactError(
                      f"Manifest lists {len(missing)} artifact(s) not yet present in S3. "
                      f"Missing keys: {missing}. "
                      f"Ensure all artifacts are uploaded before dropping manifest.json."
                  )

              return event

  ReadTextFunction:
    Type: AWS::Lambda::Function
    DependsOn: ReadTextLogGroup
    Properties:
      FunctionName: !Sub "${AWS::StackName}-ReadText"
      Runtime: python3.12
      Architectures: [arm64]
      Handler: index.handler
      Role: !GetAtt ReadTextRole.Arn
      MemorySize: 256
      Timeout: 30
      Code:
        ZipFile: |
          import boto3

          s3 = boto3.client("s3")
          MAX_TEXT_BYTES = 100_000


          def handler(event, context):
              artifact = event["artifact"]
              intake_bucket = artifact["intake_bucket"]
              key = artifact["key"]

              response = s3.get_object(Bucket=intake_bucket, Key=key)
              body = response["Body"].read(MAX_TEXT_BYTES + 1)

              if len(body) > MAX_TEXT_BYTES:
                  body = body[:MAX_TEXT_BYTES]

              try:
                  content = body.decode("utf-8")
              except UnicodeDecodeError:
                  content = body.decode("utf-8", errors="replace")

              return {"type": "text", "key": key, "content": content}

  NormalizeEvidenceFunction:
    Type: AWS::Lambda::Function
    DependsOn: NormalizeEvidenceLogGroup
    Properties:
      FunctionName: !Sub "${AWS::StackName}-NormalizeEvidence"
      Runtime: python3.12
      Architectures: [arm64]
      Handler: index.handler
      Role: !GetAtt NormalizeEvidenceRole.Arn
      MemorySize: 256
      Timeout: 30
      Code:
        ZipFile: |
          def handler(event, context):
              artifacts = event.get("artifacts", [])
              artifact_results = event.get("artifact_results", [])

              images, documents, texts = [], [], []

              for artifact, result in zip(artifacts, artifact_results):
                  atype = artifact["type"]
                  akey = artifact["key"]

                  if atype == "image":
                      labels = [
                          {"name": l.get("Name", ""), "confidence": round(l.get("Confidence", 0), 2)}
                          for l in result.get("Labels", [])[:30]
                      ]
                      images.append({"key": akey, "labels": labels})

                  elif atype == "document":
                      blocks = result.get("Blocks", [])
                      lines, form_fields = [], []
                      key_map, value_map = {}, {}
                      block_index = {b["Id"]: b for b in blocks}

                      for block in blocks:
                          btype = block.get("BlockType", "")
                          if btype == "LINE":
                              lines.append(block.get("Text", ""))
                          elif btype == "KEY_VALUE_SET":
                              entity = block.get("EntityTypes", [])
                              def get_child_text(blk):
                                  words = []
                                  for rel in blk.get("Relationships", []):
                                      if rel["Type"] == "CHILD":
                                          for cid in rel["Ids"]:
                                              child = block_index.get(cid, {})
                                              if child.get("BlockType") == "WORD":
                                                  words.append(child.get("Text", ""))
                                  return " ".join(words)
                              if "KEY" in entity:
                                  key_text = get_child_text(block)
                                  for rel in block.get("Relationships", []):
                                      if rel["Type"] == "VALUE":
                                          for vid in rel["Ids"]:
                                              value_map[vid] = key_text
                                  key_map[block["Id"]] = key_text
                              elif "VALUE" in entity:
                                  val_text = get_child_text(block)
                                  key_text = value_map.get(block["Id"], "")
                                  if key_text:
                                      form_fields.append({"key": key_text, "value": val_text})

                      documents.append({
                          "key": akey,
                          "extracted_text": "\n".join(lines)[:4000],
                          "form_fields": form_fields[:50],
                          "tables": [],
                      })

                  elif atype == "text":
                      texts.append({"key": akey, "content": result.get("content", "")[:4000]})

              return {
                  "client_id": event["client_id"],
                  "claim_id": event["claim_id"],
                  "submitted_at": event.get("submitted_at", ""),
                  "decisions_bucket": event["decisions_bucket"],
                  "evidence": {"images": images, "documents": documents, "texts": texts},
              }

  SynthesizeVerdictFunction:
    Type: AWS::Lambda::Function
    DependsOn: SynthesizeVerdictLogGroup
    Properties:
      FunctionName: !Sub "${AWS::StackName}-SynthesizeVerdict"
      Runtime: python3.12
      Architectures: [arm64]
      Handler: index.handler
      Role: !GetAtt SynthesizeVerdictRole.Arn
      MemorySize: 512
      Timeout: 120
      Code:
        ZipFile: |
          import json
          import os
          import re
          import boto3
          from botocore.config import Config

          MODEL_ID = os.environ["BEDROCK_MODEL_ID"]
          REGION = os.environ.get("AWS_REGION", "us-east-1")

          _config = Config(
              region_name=REGION,
              read_timeout=110,
              connect_timeout=10,
              retries={"max_attempts": 1},
          )
          bedrock = boto3.client("bedrock-runtime", config=_config)

          SYSTEM_PROMPT = (
              "You are an insurance claims adjudication assistant helping human adjusters "
              "review claim evidence.\n\n"
              "IMPORTANT: You are drafting a recommendation for review by a licensed adjuster. "
              "You are NOT making a final decision. Your output will be validated and may be "
              "overridden before any action is taken.\n\n"
              "Analyze the evidence provided and output a JSON object with this exact schema:\n"
              '{"recommendation":"APPROVE or DENY or NEEDS_REVIEW","confidence":<float 0.0-1.0>,'
              '"reasoning":"<2-4 sentences>","red_flags":["<list of concerns, empty if none>"],'
              '"draft_email":"<professional draft email from adjuster to claimant, 3-5 sentences>"}\n\n'
              "Guidelines:\n"
              "- APPROVE: evidence is consistent, no red flags, straightforward claim\n"
              "- DENY: clear evidence of fraud, excluded peril, or policy violation (rare)\n"
              "- NEEDS_REVIEW: ambiguous evidence, conflicting signals, or anything requiring judgment\n"
              "- confidence: how certain you are (0.0=no idea, 1.0=completely certain)\n"
              "- draft_email: written as if from adjuster to claimant (professional, empathetic)\n\n"
              "Output ONLY the JSON object. No preamble, no explanation outside the JSON."
          )


          def handler(event, context):
              client_id = event["client_id"]
              claim_id = event["claim_id"]
              evidence = event["evidence"]

              parts = [f"Claim ID: {claim_id}\nClient: {client_id}\n\n## Evidence\n"]

              if evidence.get("images"):
                  parts.append("### Image Analysis (Rekognition)\n")
                  for img in evidence["images"]:
                      labels = ", ".join(
                          f"{l['name']} ({l['confidence']:.0f}%)" for l in img["labels"]
                      )
                      parts.append(f"File: {img['key']}\nDetected: {labels}\n\n")

              if evidence.get("documents"):
                  parts.append("### Document Analysis (Textract)\n")
                  for doc in evidence["documents"]:
                      parts.append(f"File: {doc['key']}\n")
                      if doc["form_fields"]:
                          fields = "; ".join(
                              f"{f['key']}: {f['value']}" for f in doc["form_fields"][:20]
                          )
                          parts.append(f"Form fields: {fields}\n")
                      if doc["extracted_text"]:
                          parts.append(f"Extracted text:\n{doc['extracted_text'][:2000]}\n\n")

              if evidence.get("texts"):
                  parts.append("### Written Statements\n")
                  for txt in evidence["texts"]:
                      parts.append(f"File: {txt['key']}\n{txt['content'][:2000]}\n\n")

              parts.append("\nBased on this evidence, provide your adjudication recommendation as a JSON object.")
              user_message = "".join(parts)

              body = {
                  "anthropic_version": "bedrock-2023-05-31",
                  "max_tokens": 1024,
                  "system": SYSTEM_PROMPT,
                  "messages": [{"role": "user", "content": user_message}],
              }

              response = bedrock.invoke_model(
                  modelId=MODEL_ID,
                  body=json.dumps(body),
                  contentType="application/json",
                  accept="application/json",
              )

              raw_body = json.loads(response["body"].read())
              llm_text = raw_body["content"][0]["text"].strip()

              try:
                  verdict = json.loads(llm_text)
              except json.JSONDecodeError:
                  match = re.search(r"\{.*\}", llm_text, re.DOTALL)
                  if match:
                      verdict = json.loads(match.group())
                  else:
                      raise ValueError(f"Bedrock response is not valid JSON: {llm_text[:500]}")

              required = ["recommendation", "confidence", "reasoning", "red_flags", "draft_email"]
              for field in required:
                  if field not in verdict:
                      raise ValueError(f"Bedrock verdict missing required field: {field}")

              if verdict["recommendation"] not in ("APPROVE", "DENY", "NEEDS_REVIEW"):
                  raise ValueError(f"Invalid recommendation: {verdict['recommendation']}")

              return {
                  "client_id": client_id,
                  "claim_id": claim_id,
                  "submitted_at": event.get("submitted_at", ""),
                  "decisions_bucket": event["decisions_bucket"],
                  "evidence": evidence,
                  "llm_verdict": verdict,
              }
      Environment:
        Variables:
          BEDROCK_MODEL_ID: !Ref BedrockModelId

  ApplyGuardrailsFunction:
    Type: AWS::Lambda::Function
    DependsOn: ApplyGuardrailsLogGroup
    Properties:
      FunctionName: !Sub "${AWS::StackName}-ApplyGuardrails"
      Runtime: python3.12
      Architectures: [arm64]
      Handler: index.handler
      Role: !GetAtt ApplyGuardrailsRole.Arn
      MemorySize: 256
      Timeout: 30
      Code:
        ZipFile: |
          import os

          CONFIDENCE_THRESHOLD = float(os.environ.get("CONFIDENCE_THRESHOLD", "0.85"))


          def handler(event, context):
              llm_verdict = event["llm_verdict"]
              recommendation = llm_verdict["recommendation"]
              confidence = float(llm_verdict["confidence"])

              original_recommendation = recommendation
              override_reason = None

              if recommendation == "DENY":
                  override_reason = (
                      "LLM-derived DENY signals require human review. "
                      "Deterministic denial (policy lapse, fraud list) must be handled "
                      "by a rules engine, not an LLM recommendation alone."
                  )
                  recommendation = "NEEDS_REVIEW"

              elif confidence < CONFIDENCE_THRESHOLD:
                  override_reason = (
                      f"LLM confidence {confidence:.2f} is below threshold {CONFIDENCE_THRESHOLD:.2f}. "
                      "Low-confidence signals escalate to human review."
                  )
                  recommendation = "NEEDS_REVIEW"

              return {
                  "client_id": event["client_id"],
                  "claim_id": event["claim_id"],
                  "submitted_at": event.get("submitted_at", ""),
                  "decisions_bucket": event["decisions_bucket"],
                  "evidence": event["evidence"],
                  "llm_verdict": llm_verdict,
                  "final_status": recommendation,
                  "original_recommendation": original_recommendation,
                  "confidence": confidence,
                  "override_reason": override_reason,
                  "reasoning": llm_verdict.get("reasoning", ""),
                  "red_flags": llm_verdict.get("red_flags", []),
                  "draft_email": llm_verdict.get("draft_email", ""),
                  "requires_adjuster_review": recommendation == "NEEDS_REVIEW",
              }
      Environment:
        Variables:
          CONFIDENCE_THRESHOLD: !Ref ConfidenceThreshold

  WriteArtifactsFunction:
    Type: AWS::Lambda::Function
    DependsOn: WriteArtifactsLogGroup
    Properties:
      FunctionName: !Sub "${AWS::StackName}-WriteArtifacts"
      Runtime: python3.12
      Architectures: [arm64]
      Handler: index.handler
      Role: !GetAtt WriteArtifactsRole.Arn
      MemorySize: 256
      Timeout: 30
      Code:
        ZipFile: |
          import json
          import os
          from datetime import datetime, timezone, timedelta
          import boto3

          s3 = boto3.client("s3")
          dynamodb = boto3.client("dynamodb")
          TABLE_NAME = os.environ["DECISIONS_TABLE_NAME"]


          def handler(event, context):
              client_id = event["client_id"]
              claim_id = event["claim_id"]
              decisions_bucket = event["decisions_bucket"]
              prefix = f"clients/{client_id}/{claim_id}"

              now = datetime.now(timezone.utc)
              created_at = now.isoformat()
              ttl = int((now + timedelta(days=90)).timestamp())

              decision = {
                  "client_id": client_id,
                  "claim_id": claim_id,
                  "submitted_at": event.get("submitted_at", ""),
                  "processed_at": created_at,
                  "final_status": event["final_status"],
                  "original_recommendation": event["original_recommendation"],
                  "confidence": event["confidence"],
                  "override_reason": event.get("override_reason"),
                  "reasoning": event["reasoning"],
                  "red_flags": event["red_flags"],
                  "requires_adjuster_review": event["requires_adjuster_review"],
              }

              s3.put_object(
                  Bucket=decisions_bucket,
                  Key=f"{prefix}/decision.json",
                  Body=json.dumps(decision, indent=2).encode(),
                  ContentType="application/json",
              )

              draft_email = event.get("draft_email", "")
              status_line = {
                  "APPROVE": "Your claim has been reviewed and we are pleased to inform you of a favorable recommendation.",
                  "DENY": "Your claim has been reviewed. Our adjuster will contact you to discuss the findings.",
                  "NEEDS_REVIEW": "Your claim requires additional review by one of our adjusters, who will be in touch shortly.",
              }.get(decision["final_status"], "Your claim is under review.")
              red_flags_section = ""
              if decision["red_flags"]:
                  flags = "\n".join(f"- {f}" for f in decision["red_flags"])
                  red_flags_section = f"\n\n**Internal Notes (do not send to claimant):**\n{flags}"
              email_md = (
                  f"# Draft Adjuster Communication\n"
                  f"**Claim ID:** {claim_id}\n"
                  f"**Client:** {client_id}\n"
                  f"**Processed:** {created_at}\n"
                  f"**Status:** {decision['final_status']}\n"
                  f"**Confidence:** {decision['confidence']:.0%}\n\n"
                  f"> This is a DRAFT generated by the AI pipeline. Review and edit before sending.\n"
                  f"> Do not send if override_reason is present -- escalate to supervisor first.\n\n"
                  f"---\n\nDear Claimant,\n\n"
                  f"{draft_email if draft_email else status_line}\n\n"
                  f"If you have any questions regarding your claim {claim_id}, please do not hesitate to contact us.\n\n"
                  f"Sincerely,\n[Adjuster Name]\n[Company Name] Claims Department"
                  f"{red_flags_section}\n"
              )
              s3.put_object(
                  Bucket=decisions_bucket,
                  Key=f"{prefix}/adjuster_email.md",
                  Body=email_md.encode(),
                  ContentType="text/markdown",
              )

              bundle = {
                  "decision": decision,
                  "llm_verdict": event.get("llm_verdict", {}),
                  "evidence": event.get("evidence", {}),
              }
              s3.put_object(
                  Bucket=decisions_bucket,
                  Key=f"{prefix}/evidence_bundle.json",
                  Body=json.dumps(bundle, indent=2).encode(),
                  ContentType="application/json",
              )

              dynamodb.put_item(
                  TableName=TABLE_NAME,
                  Item={
                      "client_id": {"S": client_id},
                      "claim_id": {"S": claim_id},
                      "submitted_at": {"S": event.get("submitted_at", "")},
                      "processed_at": {"S": created_at},
                      "final_status": {"S": decision["final_status"]},
                      "original_recommendation": {"S": decision["original_recommendation"]},
                      "confidence": {"N": str(decision["confidence"])},
                      "requires_adjuster_review": {"BOOL": decision["requires_adjuster_review"]},
                      "reasoning": {"S": decision["reasoning"][:1000]},
                      "red_flags": {"S": json.dumps(decision["red_flags"])},
                      "decision_s3_prefix": {"S": f"s3://{decisions_bucket}/{prefix}/"},
                      "ttl": {"N": str(ttl)},
                  },
              )

              return {
                  "client_id": client_id,
                  "claim_id": claim_id,
                  "final_status": decision["final_status"],
                  "decision_s3_prefix": f"s3://{decisions_bucket}/{prefix}/",
                  "requires_adjuster_review": decision["requires_adjuster_review"],
                  "adjuster_email_text": email_md,
              }
      Environment:
        Variables:
          DECISIONS_TABLE_NAME: !Sub "${AWS::StackName}-ClaimsDecisions"

  # -------------------------------------------------------------------------
  # Step Functions -- State machine (ASL inlined via Fn::Sub)
  # -------------------------------------------------------------------------
  ClaimsStateMachine:
    Type: AWS::StepFunctions::StateMachine
    Properties:
      StateMachineName: !Sub "${AWS::StackName}-ClaimsStateMachine"
      StateMachineType: STANDARD
      RoleArn: !GetAtt StateMachineRole.Arn
      LoggingConfiguration:
        Level: ERROR
        IncludeExecutionData: true
        Destinations:
          - CloudWatchLogsLogGroup:
              LogGroupArn: !GetAtt StateMachineLogGroup.Arn
      DefinitionSubstitutions:
        ReadManifestFunctionArn: !GetAtt ReadManifestFunction.Arn
        ValidateArtifactsPresentFunctionArn: !GetAtt ValidateArtifactsFunction.Arn
        ReadTextFunctionArn: !GetAtt ReadTextFunction.Arn
        NormalizeEvidenceFunctionArn: !GetAtt NormalizeEvidenceFunction.Arn
        SynthesizeVerdictFunctionArn: !GetAtt SynthesizeVerdictFunction.Arn
        ApplyGuardrailsFunctionArn: !GetAtt ApplyGuardrailsFunction.Arn
        WriteArtifactsFunctionArn: !GetAtt WriteArtifactsFunction.Arn
        AdjusterNotificationsTopicArn: !Ref AdjusterNotificationsTopic
        ClaimsDecisionsTableName: !Sub "${AWS::StackName}-ClaimsDecisions"
      DefinitionString: |
        {
          "Comment": "insurance-claims-ai-pipeline: reads a claim manifest, validates artifacts, fans out per-artifact to Rekognition/Textract/ReadText, normalizes evidence, calls Bedrock for a recommendation, applies guardrails, writes results to S3 and DynamoDB, notifies adjuster if review is required.",
          "StartAt": "ReadManifest",
          "States": {
            "ReadManifest": {
              "Type": "Task",
              "Resource": "arn:aws:states:::lambda:invoke",
              "Parameters": {
                "FunctionName": "${ReadManifestFunctionArn}",
                "Payload.$": "$"
              },
              "ResultSelector": { "body.$": "$.Payload" },
              "ResultPath": "$",
              "OutputPath": "$.body",
              "Retry": [
                {
                  "ErrorEquals": ["Lambda.ServiceException","Lambda.AWSLambdaException","Lambda.SdkClientException"],
                  "IntervalSeconds": 2, "MaxAttempts": 3, "BackoffRate": 2.0
                }
              ],
              "Catch": [{ "ErrorEquals": ["States.ALL"], "ResultPath": "$.error", "Next": "RecordFailure" }],
              "Next": "ValidateArtifactsPresent"
            },
            "ValidateArtifactsPresent": {
              "Type": "Task",
              "Resource": "arn:aws:states:::lambda:invoke",
              "Parameters": {
                "FunctionName": "${ValidateArtifactsPresentFunctionArn}",
                "Payload.$": "$"
              },
              "ResultSelector": { "body.$": "$.Payload" },
              "ResultPath": "$",
              "OutputPath": "$.body",
              "Retry": [
                {
                  "ErrorEquals": ["Lambda.ServiceException","Lambda.AWSLambdaException","Lambda.SdkClientException"],
                  "IntervalSeconds": 2, "MaxAttempts": 3, "BackoffRate": 2.0
                }
              ],
              "Catch": [{ "ErrorEquals": ["States.ALL"], "ResultPath": "$.error", "Next": "RecordFailure" }],
              "Next": "ProcessArtifacts"
            },
            "ProcessArtifacts": {
              "Type": "Map",
              "ItemsPath": "$.artifacts",
              "ItemSelector": { "artifact.$": "$$.Map.Item.Value" },
              "MaxConcurrency": 10,
              "ResultPath": "$.artifact_results",
              "ItemProcessor": {
                "ProcessorConfig": { "Mode": "INLINE" },
                "StartAt": "ClassifyArtifact",
                "States": {
                  "ClassifyArtifact": {
                    "Type": "Choice",
                    "Choices": [
                      { "Variable": "$.artifact.type", "StringEquals": "image", "Next": "DetectLabels" },
                      { "Variable": "$.artifact.type", "StringEquals": "document", "Next": "AnalyzeDocument" },
                      { "Variable": "$.artifact.type", "StringEquals": "text", "Next": "ReadText" }
                    ],
                    "Default": "UnknownArtifactType"
                  },
                  "DetectLabels": {
                    "Type": "Task",
                    "Resource": "arn:aws:states:::aws-sdk:rekognition:detectLabels",
                    "Parameters": {
                      "Image": {
                        "S3Object": {
                          "Bucket.$": "$.artifact.intake_bucket",
                          "Name.$": "$.artifact.key"
                        }
                      },
                      "MaxLabels": 30,
                      "MinConfidence": 50
                    },
                    "ResultSelector": { "type": "image", "Labels.$": "$.Labels" },
                    "Retry": [
                      {
                        "ErrorEquals": ["Rekognition.ProvisionedThroughputExceededException"],
                        "IntervalSeconds": 2, "MaxAttempts": 3, "BackoffRate": 2.0
                      }
                    ],
                    "End": true
                  },
                  "AnalyzeDocument": {
                    "Type": "Task",
                    "Resource": "arn:aws:states:::aws-sdk:textract:analyzeDocument",
                    "Parameters": {
                      "Document": {
                        "S3Object": {
                          "Bucket.$": "$.artifact.intake_bucket",
                          "Name.$": "$.artifact.key"
                        }
                      },
                      "FeatureTypes": ["FORMS", "TABLES"]
                    },
                    "ResultSelector": { "type": "document", "Blocks.$": "$.Blocks" },
                    "Retry": [
                      {
                        "ErrorEquals": ["Textract.ProvisionedThroughputExceededException"],
                        "IntervalSeconds": 5, "MaxAttempts": 3, "BackoffRate": 2.0
                      }
                    ],
                    "End": true
                  },
                  "ReadText": {
                    "Type": "Task",
                    "Resource": "arn:aws:states:::lambda:invoke",
                    "Parameters": {
                      "FunctionName": "${ReadTextFunctionArn}",
                      "Payload.$": "$"
                    },
                    "ResultSelector": { "body.$": "$.Payload" },
                    "ResultPath": "$",
                    "OutputPath": "$.body",
                    "Retry": [
                      {
                        "ErrorEquals": ["Lambda.ServiceException","Lambda.AWSLambdaException"],
                        "IntervalSeconds": 2, "MaxAttempts": 3, "BackoffRate": 2.0
                      }
                    ],
                    "End": true
                  },
                  "UnknownArtifactType": {
                    "Type": "Fail",
                    "Error": "UnknownArtifactType",
                    "Cause": "Artifact type is not image, document, or text. Check manifest validation in ReadManifest Lambda."
                  }
                }
              },
              "Catch": [{ "ErrorEquals": ["States.ALL"], "ResultPath": "$.error", "Next": "RecordFailure" }],
              "Next": "NormalizeEvidence"
            },
            "NormalizeEvidence": {
              "Type": "Task",
              "Resource": "arn:aws:states:::lambda:invoke",
              "Parameters": {
                "FunctionName": "${NormalizeEvidenceFunctionArn}",
                "Payload.$": "$"
              },
              "ResultSelector": { "body.$": "$.Payload" },
              "ResultPath": "$",
              "OutputPath": "$.body",
              "Retry": [
                {
                  "ErrorEquals": ["Lambda.ServiceException","Lambda.AWSLambdaException"],
                  "IntervalSeconds": 2, "MaxAttempts": 3, "BackoffRate": 2.0
                }
              ],
              "Catch": [{ "ErrorEquals": ["States.ALL"], "ResultPath": "$.error", "Next": "RecordFailure" }],
              "Next": "SynthesizeVerdict"
            },
            "SynthesizeVerdict": {
              "Type": "Task",
              "Resource": "arn:aws:states:::lambda:invoke",
              "Parameters": {
                "FunctionName": "${SynthesizeVerdictFunctionArn}",
                "Payload.$": "$"
              },
              "ResultSelector": { "body.$": "$.Payload" },
              "ResultPath": "$",
              "OutputPath": "$.body",
              "Retry": [
                {
                  "ErrorEquals": ["Lambda.ServiceException","Lambda.AWSLambdaException","Lambda.SdkClientException","States.TaskFailed"],
                  "IntervalSeconds": 2, "MaxAttempts": 3, "BackoffRate": 2.0
                }
              ],
              "Catch": [{ "ErrorEquals": ["States.ALL"], "ResultPath": "$.error", "Next": "RecordFailure" }],
              "Next": "ApplyGuardrails"
            },
            "ApplyGuardrails": {
              "Type": "Task",
              "Resource": "arn:aws:states:::lambda:invoke",
              "Parameters": {
                "FunctionName": "${ApplyGuardrailsFunctionArn}",
                "Payload.$": "$"
              },
              "ResultSelector": { "body.$": "$.Payload" },
              "ResultPath": "$",
              "OutputPath": "$.body",
              "Catch": [{ "ErrorEquals": ["States.ALL"], "ResultPath": "$.error", "Next": "RecordFailure" }],
              "Next": "WriteArtifacts"
            },
            "WriteArtifacts": {
              "Type": "Task",
              "Resource": "arn:aws:states:::lambda:invoke",
              "Parameters": {
                "FunctionName": "${WriteArtifactsFunctionArn}",
                "Payload.$": "$"
              },
              "ResultSelector": { "body.$": "$.Payload" },
              "ResultPath": "$",
              "OutputPath": "$.body",
              "Catch": [{ "ErrorEquals": ["States.ALL"], "ResultPath": "$.error", "Next": "RecordFailure" }],
              "Next": "ShouldNotifyAdjuster"
            },
            "ShouldNotifyAdjuster": {
              "Type": "Choice",
              "Choices": [
                { "Variable": "$.requires_adjuster_review", "BooleanEquals": true, "Next": "NotifyAdjuster" }
              ],
              "Default": "ClaimProcessed"
            },
            "NotifyAdjuster": {
              "Type": "Task",
              "Resource": "arn:aws:states:::aws-sdk:sns:publish",
              "Parameters": {
                "TopicArn": "${AdjusterNotificationsTopicArn}",
                "Subject.$": "States.Format('Claim {} requires adjuster review - status: {}', $.claim_id, $.final_status)",
                "Message.$": "$.adjuster_email_text"
              },
              "ResultPath": null,
              "Next": "ClaimProcessed"
            },
            "ClaimProcessed": {
              "Type": "Succeed"
            },
            "RecordFailure": {
              "Type": "Task",
              "Resource": "arn:aws:states:::aws-sdk:dynamodb:putItem",
              "Parameters": {
                "TableName": "${ClaimsDecisionsTableName}",
                "Item": {
                  "client_id": { "S": "PIPELINE_ERROR" },
                  "claim_id": { "S.$": "$$.Execution.Name" },
                  "final_status": { "S": "FAILED" },
                  "error_detail": { "S.$": "States.JsonToString($.error)" },
                  "processed_at": { "S.$": "$$.Execution.StartTime" }
                }
              },
              "ResultPath": null,
              "Next": "ClaimFailed"
            },
            "ClaimFailed": {
              "Type": "Fail",
              "Error": "ClaimProcessingFailed",
              "Cause": "An error occurred during claim processing. See DynamoDB ClaimsDecisions table (PK=PIPELINE_ERROR, SK=execution-name) and SFN execution history for details."
            }
          }
        }

  # -------------------------------------------------------------------------
  # EventBridge -- fires on manifest.json object created in intake bucket
  # DependsOn: ClaimsStateMachine avoids the rule referencing a non-existent
  # state machine ARN during stack creation.
  # -------------------------------------------------------------------------
  IntakeManifestRule:
    Type: AWS::Events::Rule
    DependsOn: ClaimsStateMachine
    Properties:
      Name: !Sub "${AWS::StackName}-IntakeManifestRule"
      Description: Triggers Claims state machine when manifest.json is uploaded to intake bucket
      EventPattern:
        source:
          - aws.s3
        detail-type:
          - Object Created
        detail:
          bucket:
            name:
              - !Sub "${AWS::StackName}-intake-${AWS::AccountId}"
          object:
            key:
              - suffix: manifest.json
      State: ENABLED
      Targets:
        - Id: ClaimsStateMachineTarget
          Arn: !Ref ClaimsStateMachine
          RoleArn: !GetAtt EventBridgeRole.Arn

# ---------------------------------------------------------------------------
# Outputs
# ---------------------------------------------------------------------------
Outputs:

  IntakeBucketName:
    Description: S3 bucket for claim artifact uploads
    Value: !Ref IntakeBucket
    Export:
      Name: !Sub "${AWS::StackName}-IntakeBucketName"

  DecisionsBucketName:
    Description: S3 bucket for pipeline decision outputs
    Value: !Ref DecisionsBucket
    Export:
      Name: !Sub "${AWS::StackName}-DecisionsBucketName"

  StateMachineArn:
    Description: Step Functions state machine ARN
    Value: !Ref ClaimsStateMachine
    Export:
      Name: !Sub "${AWS::StackName}-StateMachineArn"

  TableName:
    Description: DynamoDB ClaimsDecisions table name
    Value: !Ref ClaimsDecisionsTable
    Export:
      Name: !Sub "${AWS::StackName}-TableName"

  TopicArn:
    Description: SNS adjuster notifications topic ARN
    Value: !Ref AdjusterNotificationsTopic
    Export:
      Name: !Sub "${AWS::StackName}-TopicArn"

  KmsKeyArn:
    Description: KMS key ARN used for SSE on all resources
    Value: !GetAtt KmsKey.Arn
    Export:
      Name: !Sub "${AWS::StackName}-KmsKeyArn"
